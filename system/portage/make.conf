# /etc/portage/make.conf — atlas (Surface Laptop Studio)
#
# Originally written by the catalyst stage build and then edited by hand. It was
# NOT tracked in this repo until 2026-07-26, which meant a clean checkout on bare
# hardware would have built the machine with stage3 defaults: -j1, no binhost, no
# dist-kernel. Every value below is load-bearing; the comments say why.

COMMON_FLAGS="-O2 -pipe -march=x86-64-v3"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# -march=x86-64-v3 is tied to the binhost below, which serves x86-64-v3
# packages. Changing one without the other does not error — portage silently
# stops matching binary packages and starts compiling everything from source.
# Tiger Lake supports v3; do not raise this to v4.

# 8 threads. The i7-11370H is 4 cores / 8 threads, so this is -j$(nproc).
MAKEOPTS="-j8"

# getbinpkg is what makes this a binary system: 878 packages installed and
# almost none of them compiled locally. binpkg-request-signature enforces that
# binaries are signed — the keyring portage uses for that lives in
# /etc/portage/gnupg, which is portage's own state and deliberately not tracked.
FEATURES="getbinpkg binpkg-request-signature"

# dist-kernel globally so sys-kernel/gentoo-kernel-bin's updates pull the
# initramfs rebuild and the kernel postinst hooks (see system/kernel/) rather
# than leaving a kernel installed but unbootable.
USE="dist-kernel"

# -* then re-allow: nothing installs on an implicit license. @BINARY-REDISTRIBUTABLE
# is required for the binhost packages. Anything outside these two groups needs an
# explicit entry in system/portage/package.license/atlas.
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# Intel iGPU (Iris Xe) only. The RTX 3050 Ti Mobile in this laptop is
# deliberately unused: battery life, and no out-of-tree kernel module to
# rebuild on every kernel bump. Adding nvidia here means
# x11-drivers/nvidia-drivers, a kernel module per update, and the dGPU powered on.
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

# GRUB_PLATFORMS is deliberately absent. It was set to "efi-64" by the stage
# build and became vestigial when sys-boot/grub was removed on 2026-07-26 —
# Limine is the only bootloader now. Nothing else reads
# this variable, so leaving it would have been a setting for a package that is
# not installed, which is the kind of thing that later reads as intent.
