# INSTALL_MASK for packages that ship a Wayland session entry this repo owns.
#
# Applied per-package via package.env, never globally: INSTALL_MASK in
# make.conf would silently strip this path out of EVERY package, including one
# that legitimately needs it.
#
# Why this exists (2026-08-05). gui-wm/mangowm installs
# /usr/share/wayland-sessions/mango.desktop with `Exec=mango`. This repo
# rewrites it to `Exec=/usr/local/bin/mango-session`, because the wrapper is
# what supplies the D-Bus session bus (dbus-run-session) and XCURSOR_THEME/SIZE
# -- none of which mango sets for itself.
#
# Upgrading mangowm 0.15.2 -> 0.15.6 reinstalled the package's version and
# reverted the Exec line. Ly then launched mango bare, the session came up with
# no DBUS_SESSION_BUS_ADDRESS at all, and the bus-dependent services stayed
# down -- waybar and swaync -- while swaybg and wlsunset, which need no bus,
# came up fine. That split is the signature, and it is already described in
# config/mango/autostart.sh from the first time it happened.
#
# Read that autostart.sh comment carefully if you are diagnosing this again: it
# also names nm-applet and blueman-applet, and they are RED HERRINGS now.
# Neither is started any more (see the same file, further down), so both are
# down in a perfectly healthy session. swayidle is a third red herring -- it
# was also down on 2026-08-05, for a completely unrelated reason: it was built
# with neither elogind nor systemd and exits 255 on `before-sleep`. Fixed via
# package.use. Three services down, two causes, and only two of them ever
# indicated anything about the bus.
#
# Masking the path means portage never installs the package's copy, so there is
# nothing to revert. The file is also tracked in install.sh's system_file_map,
# so if this mask is ever removed or fails, --check reports the drift rather
# than leaving it to be discovered by a missing bar after a reboot.
#
# ── One-time transition, if you ever add a package here ────────────────────
# The FIRST masked merge DELETES the file rather than preserving it, and that
# is not a bug in the mask. The path was in the package's CONTENTS from the
# previous merge, so portage's cleanup of the old instance removes it, while
# the mask stops the new copy being installed. Net result: no file at all,
# which for a session entry is worse than the wrong Exec line -- Ly offers
# nothing to log into.
#
# Observed doing exactly this on 2026-08-05. The fix is simply to redeploy
# afterwards (./install.sh packages, or the deploy_system_file call in
# phases/10-packages.sh). From then on the path is UNOWNED, portage has no
# CONTENTS entry to clean, and the file survives every subsequent merge --
# verified by merging mangowm twice more and checksumming.
INSTALL_MASK="/usr/share/wayland-sessions/mango.desktop"
