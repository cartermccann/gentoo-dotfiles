# Binary package hosts. Untracked until 2026-07-26, which combined with
# FEATURES="getbinpkg" in make.conf to make this the difference between a
# 20-minute rebuild and compiling 878 packages from source.
#
# Two entries on purpose. [binhost] serves x86-64-v3 and has the higher priority,
# matching -march=x86-64-v3 in make.conf; [gentoo] is the plain x86-64 fallback
# for anything not built for v3. If you ever change COMMON_FLAGS, change the
# [binhost] URI to match or portage stops finding binaries without saying so.
#
# The [gentoo] section was written by the catalyst build script that built this
# stage; [binhost] was added here. Both are official Gentoo distfiles hosts.
#
# location and verify-signature are stated on BOTH sections deliberately, and
# say what portage already does rather than changing it (news
# 2026-05-03-portage-binpkg-changes: >=portage-3.0.81 verifies signatures by
# default, and caches fetched binpkgs per-repo under /var/cache/binhost/NAME
# instead of mixing them into /var/cache/binpkgs with locally built ones).
#
# They were on [gentoo] only until 2026-08-05, which read as though the
# fallback repo were verified and the primary one were not. It is the reverse
# that would matter: [binhost] is priority 9999, so it is the repo nearly every
# package actually comes from. Relying on a default for the important half of a
# tracked config file is how a later default change becomes a silent one.

[gentoo]
priority = 1
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64
location = /var/cache/binhost/gentoo
verify-signature = true

[binhost]
priority = 9999
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/
location = /var/cache/binhost/binhost
verify-signature = true
