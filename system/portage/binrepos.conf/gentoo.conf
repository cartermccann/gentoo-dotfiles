# Binary package hosts. Untracked until 2026-07-26, which combined with
# FEATURES="getbinpkg" in make.conf to make this the difference between a
# 20-minute rebuild and compiling 878 packages from source.
#
# Two entries on purpose. [binhost] serves x86-64-v3 and has the higher priority,
# matching -march=x86-64-v3 in make.conf; [gentoo] is the plain x86-64 fallback
# for anything not built for v3. If you ever change COMMON_FLAGS, change the
# [binhost] URI to match or portage stops finding binaries without saying so.
#
# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consider using a local mirror.

[gentoo]
priority = 1
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64
location = /var/cache/binhost/gentoo
verify-signature = true

[binhost]
priority = 9999
sync-uri= https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/

