# Overlays. Written by `eselect repository enable guru`, which
# phases/10-packages.sh runs imperatively — but the resulting file was untracked
# until 2026-07-26, so a clean checkout had no GURU and every GURU package
# silently failed to install.
#
# GURU is load-bearing here, not a nice-to-have. These come from it:
#   gui-apps/swaync        notification daemon (config/swaync depends on it)
#   x11-misc/ly            login manager (bin/setup-ly)
#   sys-apps/sd            sed replacement
#   app-misc/watchexec     file watcher
#   media-fonts/nerdfonts  every "JetBrainsMono Nerd Font" reference
#
# created by eselect-repo

[guru]
location = /var/db/repos/guru
sync-type = git
sync-uri = https://github.com/gentoo-mirror/guru.git
