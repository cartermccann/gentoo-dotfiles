# Declarative service list: <service> <runlevel>
# Applied by phases/10-packages.sh. A service whose /etc/init.d/<name> is
# missing is reported, never silently skipped.
dbus            default
elogind         boot
NetworkManager  default
bluetooth       default
# ly is installed by bin/setup-ly (GURU Manifest workaround) — see README
ly              default
# sizes the greeter — see system/conf.d/consolefont. Must be in `boot` so the
# font is set before ly starts in `default`.
consolefont     boot
# The daemon is tailscaled, but the OpenRC script is called `tailscale` — the
# ebuild does `newinitd ${FILESDIR}/${PN}d.initd ${PN}`, installing tailscaled's
# init file under the package name. Naming it tailscaled here produced a
# service that silently did not exist, and `tailscale up` then failed with
# "failed to connect to local tailscaled".
#
# It runs unauthenticated until `tailscale up` is run once by hand, so enabling
# it joins no network on its own. It does have to be running before that
# command works at all, which is why it is enabled rather than left for later.
tailscale       default

# ── Absorbed 2026-07-26 ────────────────────────────────────────
# All four were live in the `default` runlevel and declared nowhere. The check
# only ever asked "is what the repo declares enabled?", never "is anything else
# enabled?", so they were invisible. It now asks both.

# Remote access. atlas is at 192.168.1.102 on the LAN (see
# ~/.claude/rules/atlas-environment.md) and reachable over tailscale. Note the
# login shell is fish, so `ssh atlas '<bash syntax>'` fails — pipe scripts with
# `ssh atlas 'bash -s' <<'EOF'` instead.
sshd            default

# Containers. The daemon, matching app-containers/docker in phases/32-devtools.sh.
# $USER must be in the docker group for the socket to be usable without root.
docker          default

# Time. More load-bearing than it looks: a skewed clock fails TLS verification,
# which fails `emerge --sync` and every binhost fetch, so the machine loses the
# ability to update itself before anything more obvious breaks.
chronyd         default

# System logging. Without it OpenRC service output goes nowhere, which is how a
# service that dies at boot leaves no trace to debug.
sysklogd        default
