# Declarative service list: <service> <runlevel>
# Applied by phases/10-packages.sh. A service whose /etc/init.d/<name> is
# missing is reported, never silently skipped.
dbus            default
elogind         boot
NetworkManager  default
bluetooth       default
# ly is installed by bin/setup-ly (GURU Manifest workaround) — see README
ly              default
# sizes the greeter — see system/conf.d/consolefont. Must be in `boot` so the
# font is set before ly starts in `default`.
consolefont     boot
# The daemon is tailscaled, but the OpenRC script is called `tailscale` — the
# ebuild does `newinitd ${FILESDIR}/${PN}d.initd ${PN}`, installing tailscaled's
# init file under the package name. Naming it tailscaled here produced a
# service that silently did not exist, and `tailscale up` then failed with
# "failed to connect to local tailscaled".
#
# It runs unauthenticated until `tailscale up` is run once by hand, so enabling
# it joins no network on its own. It does have to be running before that
# command works at all, which is why it is enabled rather than left for later.
tailscale       default

# ── Absorbed 2026-07-26 ────────────────────────────────────────
# All four were live in the `default` runlevel and declared nowhere. The check
# only ever asked "is what the repo declares enabled?", never "is anything else
# enabled?", so they were invisible. It now asks both.

# Remote access. atlas is at 192.168.1.102 on the LAN (see
# ~/.claude/rules/atlas-environment.md) and reachable over tailscale. Note the
# login shell is fish, so `ssh atlas '<bash syntax>'` fails — pipe scripts with
# `ssh atlas 'bash -s' <<'EOF'` instead.
sshd            default

# Containers. The daemon, matching app-containers/docker in phases/32-devtools.sh.
# $USER must be in the docker group for the socket to be usable without root.
docker          default

# Time. More load-bearing than it looks: a skewed clock fails TLS verification,
# which fails `emerge --sync` and every binhost fetch, so the machine loses the
# ability to update itself before anything more obvious breaks.
chronyd         default

# System logging. Without it OpenRC service output goes nowhere, which is how a
# service that dies at boot leaves no trace to debug.
sysklogd        default

# ── Clock ──────────────────────────────────────────────────────
# swclock, NOT hwclock, and the swap is deliberate. Added 2026-08-05.
#
# This machine's RTC reads ~367 days in the past at every boot. It is not
# drift: the RTC ticks at the right rate and holds a near-constant offset, and
# chrony's `rtcsync` writes the correct time back to it every 11 minutes all
# session long -- the RTC reads correctly while the machine is running -- yet
# the next boot is a year behind again. The firmware discards what Linux
# writes. Every boot since ~2026-07-23 shows it, and the boots before that were
# correct, so something reset it once and nothing has been able to make a
# correction stick since:
#
#   rtc_cmos: setting system clock to 2025-08-03T02:25:46 UTC   (real: 2026-08-05)
#
# hwclock cannot fix this. The KERNEL sets the system clock from the RTC before
# userspace exists, so the bad value is already in place by the time any init
# script runs; `hwclock --hctosys` only re-applies it. chronyd does fix it, but
# not until the network is up, and everything running in that window is stamped
# a year in the past: log files, file mtimes, s6 service start times (which is
# why install.sh sanity-checks s6 uptimes against /proc/uptime), and anything
# validating a TLS certificate's notBefore.
#
# swclock sets the clock from the mtime of /var/lib/misc/openrc-shutdowntime,
# which its own stop() writes at shutdown. The clock therefore starts at "last
# shutdown" rather than "a year ago", leaving chronyd a gap the size of the
# power-off instead of a gap the size of a year. It never reads the RTC at all,
# which is the right treatment for an RTC that cannot be trusted or corrected.
#
# Both scripts `provide clock`: they are alternatives, not companions, so
# hwclock must be turned off or the two will fight over the boot runlevel.
#     doas rc-update del hwclock boot
# hwclock was also removed from install.sh's BASELINE, so that if it ever comes
# back it is reported as drift instead of passing as a stock service.
#
# Caveat worth knowing before trusting this: swclock is NOT forward-only. It
# calls settimeofday unconditionally -- probed as a non-root user against stamp
# files dated 2020 and 2030, and it attempted the call for both, so there is no
# "only ever moves the clock forward" guarantee to rely on. If the RTC ever
# starts reading correctly, swclock will still rewind the clock to the last
# shutdown time. That error is bounded by how long the machine was powered off
# and chronyd's `makestep 1.0 3` erases it within seconds of the network coming
# up, which is a far smaller problem than the 367-day one it replaces.
swclock         boot
