# /etc/btrbk/btrbk.conf — atlas
#
# What this is and is not: these are SNAPSHOTS, not backups. Every one of them
# lives on /dev/nvme0n1p3, the same disk as the data. They protect against a bad
# emerge, a botched config, or an rm you regret. They protect against nothing
# that happens to the disk itself.
#
# There is no `target` line, and that is a decision rather than an omission.
# Everything under ~/projects is a git checkout with a remote, so the data that
# exists in exactly one place on this machine is on the order of a megabyte --
# not something a replication pipeline earns its keep on. Snapshots cover the
# case this machine actually has: Gentoo has no equivalent of a NixOS
# generation, so a bad emerge is otherwise genuinely hard to undo.
#
# The one job that does need a real backup is the full-disk encryption
# migration, because cryptsetup reencrypt can destroy the filesystem. That is a
# one-time image made the day it happens, not a target line here.
#
# After full-disk encryption these snapshots move inside the LUKS container.
# They stay a working rollback mechanism and become useless as an offline copy,
# since reading them will require the passphrase.

transaction_log   /var/log/btrbk.log
lockfile          /var/lock/btrbk.lock

# Long timestamps: snapshot names carry the full date and time, so what you are
# restoring is legible from `ls` without consulting btrbk.
timestamp_format  long

# Retention. Sized for a laptop with 910 GB free and ~38 GB in use, where the
# realistic recovery window is "what did I break this week".
#   - nothing is ever deleted in its first 2 days, whatever else the policy says
#   - daily snapshots kept for 14 days
#   - weekly snapshots kept for 8 weeks
# btrfs snapshots are CoW, so an idle snapshot costs almost nothing; the cost
# grows only with what changes after it is taken.
snapshot_preserve_min   2d
snapshot_preserve       14d 8w

# /.snapshots is subvol @snapshots, mounted by /etc/fstab since the install.
# btrbk does NOT create this directory and fails if it is missing.
snapshot_dir      /.snapshots

# Snapshots are read-only. This is the default and worth being explicit about:
# a writable snapshot silently diverges and stops being the thing you took it
# to be.
snapshot_create   always

# The two subvolumes that hold anything worth keeping. Named so that root and
# home snapshots are distinguishable inside a shared snapshot_dir.
#
# Note that btrfs snapshots are not recursive: nested subvolumes are captured as
# empty directories, not contents. That means docker's subvolume tree under
# /var/lib/docker and the `srv` subvolume nested in @ are NOT in these
# snapshots. For docker that is the desired outcome — container layers are
# rebuildable and would otherwise dominate the snapshot size.
subvolume /
  snapshot_name root

subvolume /home
  snapshot_name home
