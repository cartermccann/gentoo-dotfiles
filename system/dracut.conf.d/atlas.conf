# /etc/dracut.conf.d/atlas.conf — initramfs settings for atlas
#
# Deliberately empty of active settings. It exists so that this repo OWNS the
# file before anything needs to change it.
#
# Until 2026-07-26 /etc/dracut.conf.d/ did not exist and /etc/dracut.conf set
# nothing, so every initramfs on this machine was built from pure dracut
# defaults with nothing pinned or recorded. That is harmless while the root
# filesystem is plaintext: if an initramfs comes out wrong, Limine's "previous"
# entry still boots.
#
# It stops being harmless the moment root is encrypted, because the initramfs
# becomes the only thing that can open the LUKS container. At that point this
# file gains:
#
#     add_dracutmodules+=" crypt dm rootfs-block btrfs "
#     hostonly="yes"
#
# and CONFIG_DM_CRYPT=m in this kernel means dm-crypt has to be present as an
# actual module file in the image, not just as dracut's hook scripts. Verify with
#     lsinitrd /boot/initramfs-*.img | grep dm-crypt
# before rebooting, never after.
#
# The full sequence is war-gamed at
# ~/projects/wargames/wargames/atlas-fde-migration.md (Moves 3, 4, 8 and 11).
