# ═══════════════════════════════════════════════════════════════
#  atlas tmux — ported from kronos (home/tmux.nix)
#
#  No plugin manager. kronos pulled tmuxPlugins.sensible and .yank in through
#  home-manager; here their content is inlined instead. yank's entire job is
#  copy-to-clipboard, and the copy-mode binds below already pipe straight to
#  wl-copy, so it had nothing left to do. sensible is about fifteen `set`
#  lines, reproduced verbatim under "sensible defaults". Adding TPM — a
#  plugin manager that clones from the network at first launch — to deliver
#  fifteen lines of config would have made the editor's sibling the one part
#  of this repo you cannot read.
#
#  No colours are set anywhere in this file. Every colour below is a terminal
#  palette NAME (yellow / blue / magenta / white), so the status line renders
#  in whatever palette `atlas-theme` last wrote into config/ghostty/theme.conf.
#  That is why there is no config/tmux/theme.conf to go with it, and nothing
#  for bin/atlas-theme to render — tmux themes itself for free.
# ═══════════════════════════════════════════════════════════════

# ── Prefix: C-a ────────────────────────────────────────────────
# C-b is the pager "back one page" key in less, man, and fzf's preview.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── sensible defaults (was tmuxPlugins.sensible) ───────────────
set -g default-terminal "tmux-256color"
set -s escape-time 0          # 500 ms by default — an audible lag on ESC in vi mode
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

set -g base-index 1           # windows and panes count from 1, like the M-1..9 binds
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi

# True colour. tmux-256color advertises 256 colours; RGB is what tells tmux the
# outer terminal can do 24-bit, without which ghostty's palette gets quantised.
set -ag terminal-overrides ",xterm-256color:RGB"

# csi-u extended keys: Shift/Ctrl-modified keys reach TUI agents intact.
# Claude Code under ghostty needs this for shift+enter — without it the
# modifier is dropped and shift+enter submits instead of inserting a newline.
set -g extended-keys on
set -s extended-keys-format csi-u
set -g allow-passthrough on   # image protocols / OSC sequences survive the multiplexer
set -g detach-on-destroy off  # killing a session falls into the next one, not to the shell

# Window name follows the pane's cwd rather than the running command.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# ── Splits: | and - , inheriting the current directory ─────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ── Vim pane navigation and resize ─────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode → Wayland clipboard ──────────────────────────────
# wl-copy is already in the desktop stack (gui-apps/wl-clipboard); this is the
# same clipboard cliphist watches, so tmux yanks show up in Super+V history.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ── Prefix-free navigation (Alt layer) ─────────────────────────
# Mango holds SUPER and ghostty holds CTRL+SHIFT, so ALT is the free modifier.
# The C-a prefix binds above are untouched — this is an additional layer.
bind -n M-Enter   split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# ── Status line ────────────────────────────────────────────────
# bg=default, not a colour: ghostty runs at background-opacity 0.55, and any
# explicit background here would punch an opaque bar through the glass.
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-justify left
setw -g window-status-format         "#[fg=brightblack] #I #W "
setw -g window-status-current-format "#[fg=blue,bold] #I #W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"

# Mode indicators: COPY while in copy-mode, ⌘ while the prefix is armed,
# ZOOM while a pane is zoomed. Nothing renders when none of them is true.
set -g status-right '#{?pane_in_mode,#[fg=yellow]COPY ,}#{?client_prefix,#[fg=blue]⌘ ,}#{?window_zoomed_flag,#[fg=magenta]ZOOM ,}'
