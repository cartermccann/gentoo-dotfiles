# gtklock — lock screen, styled to match the Ly greeter.
#
# HAND-EDITED. Deliberately NOT generated by atlas-theme: the contract chosen
# 2026-08-06 is "lock follows Ly", i.e. this screen stays cobalt-dark on every
# theme so the lock and login screens always agree with each other. Switching to
# everforest/gruvbox will NOT recolour this file, and that is the intent. The
# palette here is copied from /etc/ly/config.ini — change both together or they
# drift apart, which is the exact problem this replaced.
#
# Paths are absolute: the glib key-file parser resolves relative paths against
# the process cwd, and swayidle's cwd is whatever mango was launched from.

[main]
style=/home/cjm/.config/gtklock/style.css
layout=/home/cjm/.config/gtklock/layout.ui

# Live ColorMix background. Draws Ly's plasma morphing in place, which CSS
# cannot do (GTK3 will not animate background-image -- tested, it silently does
# nothing). Built from colormix.c by build.sh in this directory.
#
# If this module ever fails to load, gtklock still starts and the static
# colormix.png set as the window background in style.css shows instead. Test any
# change to it in a NESTED compositor, never on the live session:
#   mango -c /tmp/nested.conf &            (a config with no exec-once)
#   WAYLAND_DISPLAY=wayland-1 gtklock
modules=/home/cjm/.config/gtklock/colormix.so

# Ly splits the two: bigclock carries the TIME, the corner clock carries the
# DATE (/etc/ly/config.ini:38-41). Same split here, same 24h as bigclock_12hr=false.
time-format=%H:%M
date-format=%A, %B %d
